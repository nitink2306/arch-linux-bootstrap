name: ShellCheck

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # git ls-files keeps the list in sync as scripts are added or moved
      - name: Syntax check all scripts
        run: |
          git ls-files '*.sh' | while read -r f; do
            echo "Checking syntax: $f"
            bash -n "$f"
          done

      - name: ShellCheck all scripts
        run: |
          git ls-files '*.sh' 'tests/*.bash' | xargs shellcheck --shell=bash --severity=warning
